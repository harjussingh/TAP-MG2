<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings | Fishbowl Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<div class="container-fluid"><div class="row">
<aside class="col-md-2 sidebar">
<h4 class="sidebar-title">Fishbowl</h4>
<div class="sidebar-subtitle">MANAGER PANEL</div>
<a href="admin_panel.html">Dashboard</a><a href="orders.html">Order Queue</a><a href="machine_monitor.html">Machine Monitor</a><a href="ingredients.html">Ingredients</a><a href="menu_recipes.html">Menu & Recipes</a><a href="customers.html">Customers</a><a href="reports.html">Reports</a><a href="settings.html" class=active>Settings</a>
</aside>
<main class="col-md-10 main-content">

<div class="mb-4"><h2 class="page-title">Settings</h2><p class="text-muted mb-0">Configure restaurant and system settings.</p></div>
<div class="card manager-card mb-4"><div class="card-header bg-white py-3"><strong>Restaurant Settings</strong></div>
<div class="card-body">
<div class="row g-3">
<div class="col-md-6"><label class="form-label">Restaurant Name</label><input class="form-control" value="Fishbowl Restaurant"></div>
<div class="col-md-6"><label class="form-label">Currency</label><select class="form-select"><option selected>AUD</option><option>USD</option></select></div>
<div class="col-md-6"><label class="form-label">GST Rate</label><div class="input-group"><input class="form-control" value="10"><span class="input-group-text">%</span></div></div>
<div class="col-md-6"><label class="form-label">Timezone</label><input class="form-control" value="Australia/Melbourne"></div>
</div></div></div>
<div class="card manager-card mb-4"><div class="card-header bg-white py-3"><strong>Order Settings</strong></div><div class="card-body">
<div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" checked id="dinein"><label class="form-check-label" for="dinein">Enable Dine-in Orders</label></div>
<div class="form-check form-switch"><input class="form-check-input" type="checkbox" checked id="takeaway"><label class="form-check-label" for="takeaway">Enable Takeaway Orders</label></div>
</div></div>
<button class="btn btn-primary">Save Changes</button>
<p class="text-muted small mt-3">The currency and GST controls are ready to be connected to the existing admin settings API.</p>

</main>
</div></div>
</body>
</html>

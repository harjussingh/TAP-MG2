{% extends "base.html" %}{% block content %}
<p>Hi {{ name }},</p>
<p>We received a request to reset your password. This link expires in {{ minutes }} minutes.</p>
<p><a href="{{ link }}" style="display:inline-block;background:#16a34a;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none">Reset password</a></p>
<p>If you didn't ask for this, you can ignore this email.</p>
{% endblock %}

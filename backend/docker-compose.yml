# Local full stack: API + MongoDB + Redis + Mailhog (catches all emails at http://localhost:8025)
services:
  api:
    build: .
    env_file: .env
    environment:
      MONGODB_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      WEB_CONCURRENCY: "2"
    ports: ["8000:8000"]
    depends_on: [mongo, redis, mailhog]
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]
    restart: unless-stopped

volumes:
  mongo_data:
